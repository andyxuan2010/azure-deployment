- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'


- task: Bash@3
  displayName: "Get public ip of container (agent pool)"
  inputs:
    targetType: 'inline'
    script: |
      # Write your commands here
      curl -s http://ipinfo.io/json | jq '.ip'

- task: TerraformTaskV4@4
  displayName: "Terraform Init"
  inputs:
    provider: 'azurerm'
    command: 'init'

    #backendServiceArm: 'sc-ccoe-iac-devops-${{variables.env}}'
    backendServiceArm: 'sc-ccoe-iac-devops-${{variables.subscription}}'
    backendAzureRmResourceGroupName: 'rg-ccoe-iac-cc-${{variables.subscription}}'
    backendAzureRmStorageAccountName: 'stccoeiaccc${{variables.subscription}}'
    backendAzureRmContainerName: 'terraform'
    backendAzureRmKey: '$(Build.Repository.Name)/terraform.tfstate'

- task: TerraformTaskV4@4
  displayName: "Terraform validate"
  inputs:
    provider: 'azurerm'
    command: 'validate'

- task: TerraformTaskV4@4
  displayName: "Terraform Plan"
  inputs:
    provider: 'azurerm'
    command: 'plan'
    #environmentServiceNameAzureRM: 'sc-ccoe-iac-devops-${{variables.env}}'
    environmentServiceNameAzureRM: 'sc-ccoe-iac-devops-${{variables.subscription}}'

- task: TerraformTaskV4@4
  displayName: "Terraform Apply"
  inputs:
    provider: 'azurerm'
    command: 'apply'
    environmentServiceNameAzureRM: 'sc-ccoe-iac-devops-${{variables.subscription}}'

